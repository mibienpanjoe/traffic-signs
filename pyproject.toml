[project]
name = "signs"
version = "0.1.0"
description = "Traffic-sign recognition on GTSRB."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "pillow>=10,<12",
    "pyarrow>=15,<22",
    "pyyaml>=6,<7",
    "scikit-image>=0.22,<1",
    "scikit-learn>=1.4,<2",
    "scipy>=1.11,<2",
    "torch>=2.4,<3",
    "torchvision>=0.19,<1",
]

[project.scripts]
signs = "signs.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signs"]

# CPU wheels keep installs small and identical on laptops and in CI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[dependency-groups]
dev = [
    "pre-commit>=3.7",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
